<!DOCTYPE html>
<html>
<head>
    <title>Placeholder Generator</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #000;
            color: #fff;
            font-family: monospace;
        }
        canvas {
            border: 1px solid #e9359e;
            display: block;
            margin: 20px 0;
        }
        button {
            background: rgba(233, 53, 158, 0.2);
            border: 1px solid #e9359e;
            color: #e9359e;
            padding: 12px 24px;
            font-family: monospace;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background: rgba(233, 53, 158, 0.4);
        }
    </style>
</head>
<body>
    <h1>16:9 Placeholder Generator</h1>
    <p>This creates a default placeholder for showcase images</p>
    <canvas id="canvas" width="1920" height="1080"></canvas>
    <button onclick="downloadImage()">Download placeholder-showcase.jpg</button>
    
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // Create gradient background
        const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
        gradient.addColorStop(0, '#1a1a1a');
        gradient.addColorStop(0.5, '#2a2a2a');
        gradient.addColorStop(1, '#1a1a1a');
        
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // Add border
        ctx.strokeStyle = 'rgba(233, 53, 158, 0.3)';
        ctx.lineWidth = 4;
        ctx.strokeRect(0, 0, canvas.width, canvas.height);
        
        // Add text
        ctx.fillStyle = 'rgba(233, 53, 158, 0.5)';
        ctx.font = 'bold 120px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('SHOWCASE', canvas.width / 2, canvas.height / 2 - 60);
        
        ctx.font = 'bold 80px monospace';
        ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.fillText('16:9', canvas.width / 2, canvas.height / 2 + 60);
        
        // Add corner decorations
        const cornerSize = 100;
        ctx.strokeStyle = '#e9359e';
        ctx.lineWidth = 3;
        
        // Top-left
        ctx.beginPath();
        ctx.moveTo(20, 20 + cornerSize);
        ctx.lineTo(20, 20);
        ctx.lineTo(20 + cornerSize, 20);
        ctx.stroke();
        
        // Top-right
        ctx.beginPath();
        ctx.moveTo(canvas.width - 20 - cornerSize, 20);
        ctx.lineTo(canvas.width - 20, 20);
        ctx.lineTo(canvas.width - 20, 20 + cornerSize);
        ctx.stroke();
        
        // Bottom-left
        ctx.beginPath();
        ctx.moveTo(20, canvas.height - 20 - cornerSize);
        ctx.lineTo(20, canvas.height - 20);
        ctx.lineTo(20 + cornerSize, canvas.height - 20);
        ctx.stroke();
        
        // Bottom-right
        ctx.beginPath();
        ctx.moveTo(canvas.width - 20 - cornerSize, canvas.height - 20);
        ctx.lineTo(canvas.width - 20, canvas.height - 20);
        ctx.lineTo(canvas.width - 20, canvas.height - 20 - cornerSize);
        ctx.stroke();
        
        function downloadImage() {
            canvas.toBlob(function(blob) {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'placeholder-showcase.jpg';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 'image/jpeg', 0.9);
        }
    </script>
</body>
</html>
